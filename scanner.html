<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Cilupi - Scanner QR</title>
<script src="https://unpkg.com/html5-qrcode@2.3.4/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#f8fafc;font-family:Arial,sans-serif;min-height:100vh;display:flex;justify-content:center}.wrap{width:100%;max-width:480px;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.title{font-size:20px;font-weight:700}.close{border:0;background:#334155;color:#fff;border-radius:10px;padding:9px 13px}.card{background:#1e293b;border:1px solid #334155;border-radius:18px;padding:14px}.reader{width:100%;min-height:320px;background:#020617;border-radius:14px;overflow:hidden}.status{text-align:center;color:#94a3b8;font-size:13px;line-height:1.5;margin:14px 4px}.btn{width:100%;border:0;border-radius:12px;padding:13px;font-weight:700;background:#3b82f6;color:#fff}.btn:disabled{opacity:.5}.hint{font-size:11px;color:#94a3b8;text-align:center;margin-top:10px}.error{color:#fca5a5}.ok{color:#86efac}</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="title">Scan QR Absensi</div><button class="close" onclick="closeWindow()">Tutup</button></div>
  <div class="card">
    <div id="reader" class="reader"></div>
    <div id="status" class="status">Meminta izin kamera...</div>
    <button id="retry" class="btn" style="display:none" onclick="startScanner()">Coba Lagi</button>
    <div class="hint">Gunakan kamera belakang dan arahkan QR Code ke kotak scanner.</div>
  </div>
</div>
<script>
var scanner=null,busy=false;
function setStatus(t,cls){var e=document.getElementById('status');e.className='status '+(cls||'');e.innerHTML=t;}
function closeWindow(){try{if(scanner)scanner.stop().catch(function(){});}catch(e){}window.close();}
function capturePhoto(){try{var v=document.querySelector('#reader video');if(!v||!v.videoWidth)return '';var c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);return c.toDataURL('image/jpeg',0.5);}catch(e){return '';}}
function sendResult(text){if(busy)return;busy=true;setStatus('QR terbaca. Mengirim data...','ok');var foto=capturePhoto();var payload={type:'CILUPI_QR_RESULT',text:String(text||''),foto:foto};try{if(window.opener&&!window.opener.closed){window.opener.postMessage(payload,'*');setTimeout(function(){try{scanner.stop().catch(function(){});}catch(e){}window.close();},500);}else{setStatus('Halaman utama sudah tidak terbuka. Tutup scanner lalu buka kembali aplikasi.','error');}}catch(e){setStatus('Gagal mengirim hasil scan: '+e.message,'error');}}
function startScanner(){
  busy=false;document.getElementById('retry').style.display='none';
  setStatus('Meminta izin kamera...');
  if(!window.isSecureContext){setStatus('Kamera membutuhkan HTTPS. Buka scanner melalui URL HTTPS.','error');document.getElementById('retry').style.display='block';return;}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setStatus('Browser tidak mendukung akses kamera. Gunakan Chrome atau Edge terbaru.','error');document.getElementById('retry').style.display='block';return;}
  if(scanner){try{scanner.clear();}catch(e){}}
  scanner=new Html5Qrcode('reader');
  scanner.start({facingMode:{ideal:'environment'}},{fps:10,qrbox:function(w,h){var q=Math.floor(Math.min(w,h)*0.65);return {width:Math.max(180,Math.min(300,q)),height:Math.max(180,Math.min(300,q))};}},function(decodedText){sendResult(decodedText);},function(){})
  .then(function(){setStatus('Kamera aktif. Arahkan QR Code ke kotak scanner.');})
  .catch(function(err){
    var n=err&&err.name?err.name:'';var msg='Kamera tidak dapat diakses.';
    if(n==='NotAllowedError'||n==='PermissionDeniedError')msg='IZIN KAMERA DITOLAK. Izinkan kamera untuk halaman scanner ini, lalu tekan Coba Lagi.';
    else if(n==='NotFoundError'||n==='DevicesNotFoundError')msg='Kamera tidak ditemukan pada perangkat.';
    else if(n==='NotReadableError'||n==='TrackStartError')msg='Kamera sedang digunakan aplikasi lain. Tutup aplikasi kamera lain lalu coba lagi.';
    else if(n==='SecurityError')msg='Browser memblokir kamera. Pastikan URL scanner menggunakan HTTPS.';
    setStatus(msg+'<br><small>'+String(err)+'</small>','error');document.getElementById('retry').style.display='block';
  });
}
window.addEventListener('load',startScanner);
</script>
</body>
</html>
