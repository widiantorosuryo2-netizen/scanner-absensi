<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Scanner Absensi</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: auto;
      padding: 15px;
    }

    h2 {
      margin: 10px 0 15px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: auto;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 13px 20px;
      margin: 8px 4px;
      font-size: 16px;
      cursor: pointer;
    }

    #startBtn {
      background: #2196f3;
      color: white;
    }

    #stopBtn {
      background: #f44336;
      color: white;
    }

    #status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      background: #222;
      font-size: 14px;
      line-height: 1.5;
    }

    #result {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      background: #333;
      word-break: break-word;
      display: none;
    }

    .warning {
      color: #ffcc00;
    }

    .error {
      color: #ff5252;
    }

    .success {
      color: #4caf50;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>📷 Scanner Absensi</h2>

  <div id="reader"></div>

  <div>
    <button id="startBtn" onclick="startScanner()">
      ▶ Mulai Kamera
    </button>

    <button id="stopBtn" onclick="stopScanner()">
      ⏹ Matikan Kamera
    </button>
  </div>

  <div id="status">
    Tekan <b>Mulai Kamera</b> untuk memulai scanner.
  </div>

  <div id="result"></div>

</div>

<!-- Library QR Scanner -->
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<script>
  let scanner = null;
  let scanning = false;

  const statusBox = document.getElementById("status");
  const resultBox = document.getElementById("result");

  function setStatus(message, type = "") {
    statusBox.className = type;
    statusBox.innerHTML = message;
  }

  function showResult(message) {
    resultBox.style.display = "block";
    resultBox.innerHTML = message;
  }

  async function startScanner() {

    if (scanning) {
      setStatus("Scanner sudah berjalan.", "warning");
      return;
    }

    // Cek HTTPS
    if (!window.isSecureContext) {
      setStatus(
        "❌ Kamera membutuhkan koneksi HTTPS.<br>" +
        "Pastikan Anda membuka scanner melalui URL GitHub Pages.",
        "error"
      );
      return;
    }

    // Cek dukungan kamera
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus(
        "❌ Browser tidak mendukung akses kamera.",
        "error"
      );
      return;
    }

    setStatus(
      "⏳ Meminta izin kamera...",
      "warning"
    );

    try {

      // Meminta izin kamera terlebih dahulu
      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: {
            ideal: "environment"
          }
        },
        audio: false
      });

      // Matikan stream sementara.
      // html5-qrcode akan membuka kamera kembali.
      stream.getTracks().forEach(track => track.stop());

    } catch (error) {

      console.error("Camera permission error:", error);

      if (error.name === "NotAllowedError") {

        setStatus(
          "❌ IZIN KAMERA DITOLAK.<br><br>" +
          "Silakan tekan ikon 🔒 di sebelah alamat website " +
          "→ Kamera → Izinkan.<br><br>" +
          "Setelah itu refresh halaman.",
          "error"
        );

        return;
      }

      if (error.name === "NotFoundError") {

        setStatus(
          "❌ Kamera tidak ditemukan pada perangkat.",
          "error"
        );

        return;
      }

      if (error.name === "NotReadableError") {

        setStatus(
          "❌ Kamera sedang digunakan aplikasi lain.<br>" +
          "Tutup aplikasi yang menggunakan kamera lalu coba lagi.",
          "error"
        );

        return;
      }

      setStatus(
        "❌ Kamera tidak dapat diakses.<br>" +
        "Error: " + error.name,
        "error"
      );

      return;
    }

    scanner = new Html5Qrcode("reader");

    const config = {
      fps: 10,
      qrbox: function(viewfinderWidth, viewfinderHeight) {

        const minEdge = Math.min(
          viewfinderWidth,
          viewfinderHeight
        );

        const size = Math.floor(minEdge * 0.70);

        return {
          width: size,
          height: size
        };
      },

      aspectRatio: 1.0
    };

    setStatus(
      "📷 Kamera aktif.<br>" +
      "Arahkan QR Code ke kotak scanner.",
      "success"
    );

    try {

      await scanner.start(

        {
          facingMode: "environment"
        },

        config,

        onScanSuccess,

        onScanFailure

      );

      scanning = true;

    } catch (error) {

      console.error("Scanner start error:", error);

      setStatus(
        "❌ Scanner tidak dapat dimulai.<br><br>" +
        "Error: " + error,
        "error"
      );

      scanning = false;
    }
  }


  function onScanSuccess(decodedText, decodedResult) {

    if (!decodedText) {
      return;
    }

    console.log("QR terbaca:", decodedText);

    showResult(
      "<b>✅ QR BERHASIL DIBACA</b><br><br>" +
      escapeHtml(decodedText)
    );

    setStatus(
      "✅ QR Code berhasil dibaca.",
      "success"
    );

    // Hentikan kamera
    stopScanner();

    /*
     * Mengirim hasil kembali ke halaman sebelumnya.
     *
     * Jika scanner dibuka oleh Apps Script menggunakan:
     *
     * scanner.html?callback=...
     *
     * maka data QR dapat diteruskan melalui postMessage.
     */

    try {

      if (window.opener) {

        window.opener.postMessage(
          {
            type: "QR_SCANNED",
            value: decodedText
          },
          "*"
        );

      }

    } catch (error) {

      console.log(
        "Tidak dapat mengirim data ke window.opener:",
        error
      );

    }

    // Jika halaman scanner dibuka dari Apps Script
    // melalui parameter callback, kirim juga melalui URL.
    sendResultToParent(decodedText);
  }


  function sendResultToParent(value) {

    try {

      const params = new URLSearchParams(
        window.location.search
      );

      const callback = params.get("callback");

      if (callback) {

        window.location.href =
          callback +
          "?qr=" +
          encodeURIComponent(value);

      }

    } catch (error) {

      console.log(
        "Callback tidak digunakan:",
        error
      );

    }
  }


  function onScanFailure(errorMessage) {

    // Jangan tampilkan error setiap frame.
    // Scanner memang akan sering gagal membaca frame
    // sebelum menemukan QR.
  }


  async function stopScanner() {

    if (!scanner || !scanning) {
      return;
    }

    try {

      await scanner.stop();

      await scanner.clear();

    } catch (error) {

      console.log(
        "Stop scanner:",
        error
      );

    }

    scanner = null;
    scanning = false;

    setStatus(
      "Kamera dimatikan.<br>" +
      "Tekan <b>Mulai Kamera</b> untuk memindai lagi."
    );
  }


  function escapeHtml(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
  }


  // Membersihkan kamera ketika halaman ditutup
  window.addEventListener("beforeunload", function() {

    if (scanner && scanning) {

      try {
        scanner.stop();
      } catch (e) {}

    }

  });

</script>

</body>
</html>
